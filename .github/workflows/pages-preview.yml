name: Seiten Vorschau

# Die Umgebung github-pages erlaubt nur den Branch main.
# Dieser Workflow läuft deshalb auf main und baut den Tabellen-Branch,
# ohne den Pull Request zu mergen.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: cursor/tabellenansicht-schritt5-d6cb
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /finanzplaner/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
