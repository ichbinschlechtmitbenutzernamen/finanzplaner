name: Prüfen

on:
  pull_request:
  push:
    branches:
      - main
      - "cursor/**"

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: LibreOffice für den Formelabgleich
        run: sudo apt-get update && sudo apt-get install -y libreoffice-calc python3-uno
      - run: npm test
      - run: npm run lint
      - run: npm run build
