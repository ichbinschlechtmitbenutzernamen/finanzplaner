name: Seiten

# Vorübergehend nur manuell. pages-preview.yml veröffentlicht den Prüf-Branch.
# Nach dem Merge veröffentlicht dieser Workflow wieder main.

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run lint
      - run: npm run build
        env:
          VITE_BASE: /finanzplaner/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: pruefen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
